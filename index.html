<title>La Tangerine Cashier</title>
<style>
:root{--bg:#fffff7;--sf:#fffff7;--tx:#2b0d10;--mu:#7a5650;--ac:#9b121e;--ac-t:#fffff7;--soft:#fce9d7;--bd:#ebd0cc;--ok:#2f7d4f;--bad:#b3261e;--or:#e96d1f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;-webkit-text-size-adjust:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
input,select{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px;width:100%}
.primary{background:var(--ac);color:var(--ac-t);border-color:var(--ac);font-weight:700}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.menu{display:flex;flex-direction:column;min-height:0;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chips button{white-space:nowrap;border-radius:99px}
.chips .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding-bottom:90px}
.item{text-align:left;display:block;height:auto;min-height:92px;padding:12px}.item b,.item span,.item small{display:block}.item span,.item small{margin-top:6px}
.item b{font-weight:600}.item span{color:var(--ac);font-weight:700}
.item:active{background:var(--soft)}
.custom{display:grid;grid-template-columns:1fr 120px auto;gap:8px;padding:10px 0}
.order{background:var(--sf);border-left:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.order h2{margin:0;padding:14px 16px 6px;font-size:17px;display:flex;justify-content:space-between}
.lines{flex:1;overflow-y:auto;padding:0 16px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.line .q{display:flex;align-items:center;gap:6px}
.q button{width:36px;min-height:36px;padding:0}
.empty{color:var(--mu);padding:24px 0;text-align:center}
.pay{padding:12px 16px 16px;border-top:1px solid var(--bd);display:grid;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.total{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--ac)}
.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button{min-height:38px;padding:6px 10px}
.muted{color:var(--mu);font-size:14px}.chg{font-weight:700}
.bar{display:none}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;z-index:30}
.modal.open{display:flex}
.card{background:var(--sf);border-radius:14px;padding:16px;width:100%;max-width:640px}
.card h3{margin:0 0 10px}
.erow{display:grid;grid-template-columns:1fr 110px 120px 44px;gap:6px;margin-bottom:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:2px}
#receipt{display:none}
@media (max-width:800px){
 .app{grid-template-columns:minmax(0,1fr)}
 .order{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;transform:translateY(100%);transition:transform .2s;border:0}
 .order.open{transform:none}
 .bar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:10;justify-content:space-between;align-items:center;min-height:54px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25)}
 .erow{grid-template-columns:1fr 90px 44px}.erow .cat{display:none}
 .custom{grid-template-columns:1fr 100px auto}
}
@media (prefers-reduced-motion:reduce){.order{transition:none}}
.hbtn{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.hbtn select{width:auto}.hbtn button{padding:8px 10px}.item:disabled{opacity:.45;cursor:not-allowed}input:disabled,select:disabled,.quick button:disabled{opacity:.5;cursor:not-allowed}.erow{grid-template-columns:1fr 100px 110px 80px 60px 44px}@media (max-width:800px){.erow{grid-template-columns:1fr 80px 70px 60px 44px}}.erow.pr{grid-template-columns:1fr 110px 80px;align-items:center}.item s{color:var(--mu);font-weight:400;font-size:13px}.erow.pm{grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--bd);padding-bottom:10px;margin-bottom:12px}.erow.pm input{padding:8px 6px;font-size:16px}#pitems{max-height:38vh;overflow-y:auto;margin-bottom:8px}#mx{z-index:40}#mc{z-index:50}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:60;background:var(--ac);color:var(--ac-t);padding:10px 16px;border-radius:10px;max-width:90%;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.bl{max-height:34vh;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;padding:2px 8px;margin-top:6px}.bi{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--bd)}.bi:last-child{border-bottom:0}.bi[hidden]{display:none}.bi span{overflow-wrap:anywhere}
.chk{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx)}.chk input{width:auto;min-height:0;flex:none}
.gscroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:90px}.gscroll>.grid{flex:none;overflow:visible;padding-bottom:0}
[hidden]{display:none!important}
.item{border:1px solid var(--bd);background:var(--sf);border-radius:10px;cursor:pointer;overflow-wrap:anywhere;word-break:break-word;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.item.off{opacity:.45;cursor:not-allowed}.item:focus-visible{outline:3px solid var(--ac);outline-offset:1px}.item span,.item b{overflow-wrap:anywhere}
.cl b,.cl .muted{overflow-wrap:anywhere}
.set{max-width:780px}.sethead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tabs{display:flex;gap:6px;margin:8px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--bd)}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--ac-t);border-color:var(--ac);font-weight:700}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.7fr);gap:8px;margin-bottom:8px}.toolbar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.toolbar2 .primary{flex:1 1 160px}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px}
.pr b,.pr .muted{overflow-wrap:anywhere}.pr .pa{grid-column:1/3;display:flex;gap:6px}.pr .pa button{flex:1 1 0;min-height:40px}
.danger{color:var(--bad);border-color:var(--bad)}.badge{display:inline-block;padding:1px 8px;margin-left:6px;border-radius:99px;background:var(--soft);font-size:12px;color:var(--tx)}
.setbar{position:sticky;bottom:0;background:var(--bg);display:flex;gap:8px;justify-content:flex-end;padding:10px 0 2px;margin-top:10px;border-top:1px solid var(--bd)}.setbar button{flex:1 1 0;max-width:240px}
.err{color:var(--bad);margin-top:8px;font-weight:600}.err:empty{display:none}.ef{display:grid;gap:10px}.hint{color:var(--mu);font-size:12px}
.diff{background:var(--soft);border-radius:10px;padding:8px 10px;margin:8px 0}.diff div{padding:2px 0}
.chips .on{background:var(--or);border-color:var(--or);color:var(--tx);font-weight:700}
.item{border-color:var(--bd)}.item:active,.item:hover{background:var(--soft);border-color:var(--or)}
.order{border-top:4px solid var(--or)}header h1{color:var(--ac)}.order h2{color:var(--ac)}
.pay .quick button{border-color:var(--or)}
textarea{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:44px;width:100%;resize:none;overflow:hidden;font:inherit;color:inherit;line-height:1.3}
textarea:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.erow.prow{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.erow.prow>*{flex:1 1 100px;min-width:0}.erow.prow>textarea{flex:3 1 220px}.erow.prow>button{flex:0 0 auto}.erow.prow .cat{display:block}
.erow.pm{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}#sy{flex-basis:100%;font-size:12px}#sy:empty{display:none}
html,body{max-width:100%;overflow-x:hidden}.menu{min-width:0}header{flex-wrap:wrap}header h1{flex:1 1 auto;min-width:0}
.hbtn{flex:0 1 auto;max-width:100%}
@media (max-width:800px){h1{font-size:18px}.hbtn{width:100%;justify-content:flex-start}.hbtn button,.hbtn select{min-height:38px;padding:6px 10px;font-size:15px}.chips{max-width:100%}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
.cl{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd)}
.cl .muted{font-size:12px}.cl .q button{width:32px;min-height:32px}.cl>b{text-align:right}
.order h2{padding:8px 12px 4px;font-size:16px}.lines{padding:0 12px}
.pay{padding:8px 12px 10px;gap:5px;max-height:62vh;overflow-y:auto}
.pay label{font-size:12px;margin:0}
.pay input,.pay select{min-height:36px;padding:4px 8px;font-size:16px}
.pay .row{font-size:14px}.pay .muted{font-size:13px}
.dgrid{display:grid;grid-template-columns:1.3fr 1fr .9fr;gap:6px}
.pay .quick{gap:4px}.pay .quick button{min-height:30px;padding:2px 9px;font-size:13px}
.pay .bt{grid-template-columns:1fr 2fr}.pay .bt button{min-height:44px}
#tTotal{font-size:26px}#msg:empty{display:none}
.nl{max-height:32vh;overflow-y:auto;border-bottom:1px solid var(--bd);margin-bottom:8px;padding-bottom:6px}.nl .row{font-size:14px;padding:2px 0}.card h4{margin:14px 0 6px}
@media print{
 @page{margin:0}
 body>*:not(#receipt){display:none!important}
 #receipt{display:block;width:72mm;margin:0 auto;padding:4mm;color:#000;background:#fff;font:12px/1.35 "Courier New",monospace}
 #receipt h4{text-align:center;font-size:16px;margin:0 0 2px}
 #receipt .c{text-align:center}
 #receipt .r{display:flex;justify-content:space-between;gap:8px}
 #receipt hr{border:0;border-top:1px dashed #000;margin:6px 0}
}
</style>
</head>
<body>
<div id="boot" style="padding:16px;font:16px system-ui,sans-serif">Loading La Tangerine Cashier...</div>
<div class="app">
 <section class="menu">
  <header>
   <h1 id="shopname"></h1>
   <div class="hbtn"><select id="staff" aria-label="Cashier"></select><button id="btnPre">Pre-orders</button><button id="btnRep">Sales</button><button id="btnExp">Export</button><button id="btnRc">Receipts</button><button id="btnEdit">Settings</button></div><span id="sy" class="muted"></span>
  </header>
  <div class="chips" id="chips"></div>
  <div class="gscroll"><div class="grid" id="grid"></div></div>
  <div class="custom">
   <input id="cName" placeholder="Custom item (e.g. Birthday cake)">
   <input id="cPrice" type="number" inputmode="decimal" min="0" placeholder="Price">
   <button id="cAdd">Add</button>
  </div>
 </section>

 <aside class="order" id="order">
  <h2><span>Current order <span class="muted" id="rno"></span></span><button id="btnClose" class="close">Close</button></h2>
  <div class="lines" id="lines"></div>
  <div class="pay">
   <div class="row muted"><span>Subtotal</span><span id="tSub"></span></div>
   <div class="row muted" id="rDisc"><span>Discount</span><span id="tDisc"></span></div>
   <div class="row muted" id="rTax"><span id="tTaxL">Tax</span><span id="tTax"></span></div>
   <div class="dgrid">
    <div><label for="vcode">Voucher code</label><input id="vcode" maxlength="40" autocomplete="off" placeholder="Enter code"></div>
    <div><label for="dVal">Discount</label><input id="dVal" type="number" inputmode="decimal" min="0" value="0"></div>
    <div><label for="dType">Type</label><select id="dType"><option value="%">%</option><option value="amt">Amount</option></select></div>
   </div>
   <div class="quick" id="dq"><button data-d="0">No discount</button><button data-d="5">5%</button><button data-d="10">10%</button><button data-d="20">20%</button></div>
   <div class="row" style="align-items:baseline"><span>Total</span><span class="total" id="tTotal"></span></div>
   <div class="two">
    <div><label for="method">Payment method</label><select id="method"><option>Cash</option><option>QRIS</option><option>Card</option><option>Transfer</option></select></div>
    <div id="cashBox"><label for="cash">Cash received</label><input id="cash" type="number" inputmode="decimal" min="0"></div>
   </div>
   <div class="quick" id="quick"></div>
   <div class="row"><span>Change</span><span class="chg" id="tChg">0</span></div>
   <div class="two bt"><button id="btnClear">Clear order</button><button id="btnPay" class="primary">Pay and print</button></div>
   <div class="muted" id="msg" role="status"></div>
  </div>
 </aside>
</div>

<button class="bar primary" id="bar"><span id="barN">0 items</span><span id="barT">View order</span></button>

<div class="modal" id="modal">
 <div class="card set">
  <div class="sethead"><h3>Settings</h3><span id="pend" class="muted"></span></div>
  <div class="tabs"><button data-t="menu" class="on">Menu</button><button data-t="shop">Store</button><button data-t="sync">Sync and PIN</button></div>
  <section id="t-menu">
   <div class="toolbar"><input id="mSearch" type="search" placeholder="Search product" aria-label="Search product"><select id="mCat" aria-label="Filter by category"></select></div>

 let no;try{$("#btnPay").disabled=true;no=pendNo||(pendNo=await reserve("rno"))}finally{$("#btnPay").disabled=false}
 ask("Confirm payment",sm,()=>{const t=calc();
 receipt(t,method==="Cash"?c:total,method==="Cash"?c-total:0,method,"",cart,no);
 doPrint();
 record("sale",total,method,Object.assign({ref:no,voucher:$("#vcode").value.trim()},t));pendNo=null;useStock(cart);bump("cc_rno");newOrder();say("Order complete. Ready for the next customer.");toast("Sale saved. If the receipt did not print, tap Receipts to print it again.");})

 {const er=(m,t)=>{showTab(t);$("#sErr").textContent=m;return true},tax=$("#sTax").value,url=$("#sUrl").value.trim(),code=$("#sCode").value.trim();

let SY=load("cc_sync",{url:"",code:""}),out=load("cc_out",[]),syBusy=false,pendNo=null,pendPO=null,sig="";
const syOn=()=>!!(SY.url&&SY.code&&SY.code.length>=16);
const syBase=()=>SY.url.replace(/\/+$/,"")+"/shops/"+encodeURIComponent(SY.code);
const syStat=(t,bad)=>{const e=$("#sy");if(e){e.textContent=t;e.style.color=bad?"var(--bad)":""}};
async function api(m,p,b,q,ms){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms||10000);let r;try{r=await fetch(syBase()+"/"+p+".json"+(q||""),{method:m,body:b===undefined?undefined:JSON.stringify(b),signal:ac.signal})}finally{clearTimeout(tm)}if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}return r.json()}
async function send(m,p,b){if(!syOn())return;try{await api(m,p,b)}catch(e){if(!e.status||e.status>=500){out.push({m,p,b});save("cc_out",out)}else syStat("Sync error "+e.status+": check the database rules",true)}}
async function flush(){if(!syOn()||!out.length)return;const q=out.slice();out=[];save("cc_out",out);for(const o of q)await send(o.m,o.p,o.b)}
function skey(s){return s.k||(s.k=s.ts+"_"+s.type+"_"+String(s.ref||s.no).replace(/[.$#\[\]\/]/g,"-"))}
const pkey=p=>p.no||p.id;
function pushSettings(){const o={};Object.keys(S).forEach(k=>o[k]=S[k]);o.adm=adm||null;send("PUT","settings",o)}
function pushMenu(){const o={};M.forEach((i,k)=>{const x={};Object.keys(i).forEach(f=>x[f]=i[f]);x._o=k;o[i.id]=x});send("PUT","menu",M.length?o:null)}
async function reserve(kind){const d=ddmmyy(),loc=()=>peek(kind==="rno"?"cc_rno":"cc_pno2");if(!syOn())return loc();
 for(let i=0;i<6;i++){try{const r=await api("GET",kind,undefined,'?orderBy="$key"&startAt="'+d+'0000"&endAt="'+d+'9999"&limitToLast=1',3000),last=r&&Object.keys(r)[0],n=d+String((last?+last.slice(6):0)+1).padStart(4,"0");
  await api("PUT",kind+"/"+n,{t:Date.now()},undefined,3000);return n}catch(e){if(e.status===401||e.status===403)continue;break}}
 return loc()}
async function pull(first){const g=p=>api("GET",p),[rs,rm,rp]=await Promise.all([g("settings"),g("menu"),g("pre")]);
 if(!rs&&!rm){if(first){pushSettings();pushMenu();pre.forEach(p=>send("PUT","pre/"+pkey(p),p));await pullSales(true)}return}
 if(first){pre.forEach(p=>{if(!rp||!rp[pkey(p)])send("PUT","pre/"+pkey(p),p)});pullSales(true)}
 const sg=JSON.stringify([rs,rm,rp]);if(sg===sig||$("#modal").classList.contains("open"))return;sig=sg;
 if(rs){Object.keys(rs).forEach(k=>{if(k!=="adm")S[k]=rs[k]});save("cc_set",S);if(rs.adm&&(!adm||adm.hash!==rs.adm.hash)){adm=rs.adm;save("cc_admin",adm)}}
 if(rm){M=Object.keys(rm).map(k=>rm[k]).sort((a,b)=>(a._o||0)-(b._o||0)).map(i=>{const x={};Object.keys(i).forEach(f=>{if(f!=="_o")x[f]=i[f]});return x});save("cc_menu",M)}
 if(rp){const m={};pre.forEach(p=>m[pkey(p)]=p);Object.keys(rp).forEach(k=>{const p=rp[k];p.lines=p.lines||[];m[k]=p});pre=Object.keys(m).map(k=>m[k]);save("cc_pre",pre)}
 renderMenu();renderCart();hdr()}
async function pullSales(up){if(!syOn())return;try{await flush();const r=await api("GET","sales"),m={};sales.forEach(s=>m[skey(s)]=s);
 if(up)sales.forEach(s=>{if(!r||!r[s.k])send("PUT","sales/"+s.k,s)});
 if(r)Object.keys(r).forEach(k=>{const s=r[k];s.items=s.items||[];s.k=k;m[k]=s});
 sales=Object.keys(m).map(k=>m[k]).sort((a,b)=>a.ts-b.ts);save("cc_sales",sales)}catch(e){syStat("Offline: showing this device data only",true)}}
async function syncNow(first){if(!syOn()){syStat("");return}if(syBusy)return;syBusy=true;syStat("Syncing...");
 try{await flush();await pull(first);syStat("Synced "+new Date().toTimeString().slice(0,5))}
 catch(e){syStat(e.status?"Sync error "+e.status+": check the database address and rules":"Offline: saving on this device",true)}finally{syBusy=false}}
setInterval(()=>syncNow(false),15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow(false)});
$("#sGen").onclick=()=>{const a=new Uint8Array(24),c="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*256)}).getRandomValues(a);$("#sCode").value=Array.from(a).map(x=>c[x%c.length]).join("")};
/* ---- Settings: tabs, product list with category filter, edit form, confirmations ---- */
let snapM="[]",pendN=0,fCat="All",fQ="";
const curCats=()=>Array.from(new Set(M.filter(i=>on(i)).map(i=>i.cat||"Other")));
const pendSet=()=>{$("#pend").textContent=pendN?pendN+" unsaved change"+(pendN>1?"s":""):""};
function showTab(t){["menu","shop","sync"].forEach(x=>{$("#t-"+x).hidden=x!==t});document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));$("#sErr").textContent=""}
function promoInfo(i){if(i.promo==null||i.promo==="")return "";return promoOn(i)?"Promo running":(i.pFrom&&day(Date.now())<i.pFrom?"Promo starts "+i.pFrom:"Promo ended")}
function editor(){
 $("#sShop").value=S.shop;$("#sRn").value=S.rname||S.shop;$("#sCur").value=S.cur;$("#sTax").value=S.tax;$("#sFoot").value=S.foot;$("#sStaff").value=S.staff;$("#sRef").value=nz(S.refund,3);$("#sMin").value=nz(S.minDep,30);$("#sBox").value=S.box||"m";$("#sUrl").value=SY.url;$("#sCode").value=SY.code;
 renderList();pendSet()}
function renderList(){const cs=curCats();if(fCat!=="All"&&cs.indexOf(fCat)<0)fCat="All";
 $("#mCat").innerHTML='<option value="All">All categories ('+M.filter(i=>on(i)).length+')</option>'+cs.map(c=>`<option value="${esc(c)}"${c===fCat?" selected":""}>${esc(c)} (${M.filter(i=>on(i)&&(i.cat||"Other")===c).length})</option>`).join("");
 const q=fQ.trim().toLowerCase(),L=M.filter(i=>on(i)&&(fCat==="All"||(i.cat||"Other")===fCat)&&(!q||String(i.name).toLowerCase().indexOf(q)>=0));
 $("#mCount").textContent=L.length+" product"+(L.length===1?"":"s")+" shown";
 $("#erows").innerHTML=L.map(i=>{const pi=promoInfo(i);return `<div class="pr"><div><b>${esc(i.name)}</b><div class="muted">${esc(i.cat||"Other")}${pi?`<span class="badge">${pi}</span>`:""}</div>${isB(i)?`<div class="muted">Contains: ${esc(incStr(i))}</div>`:""}</div><div style="text-align:right">${promoOn(i)?`<s class="muted">${fmt(i.price)}</s> <b>${fmt(i.promo)}</b>`:`<b>${fmt(i.price)}</b>`}<div class="muted">${isB(i)?(av(i)==null?"Bundle":"Bundle: "+av(i)+" possible"):tracked(i)?"Stock: "+i.stock:"Stock not tracked"}</div></div><div class="pa"><button data-e="${i.id}">Edit</button><button data-h="${i.id}">Hide</button><button class="danger" data-d="${i.id}">Delete</button></div></div>`}).join("")||'<div class="empty">No products found.</div>'}
function cfm(title,body,yesLbl,yes){yesFn=yes;$("#mcc").innerHTML=`<h3>${title}</h3>${body}<div class="two" style="margin-top:14px"><button id="mcNo">No, go back</button><button class="primary" id="mcYes">${yesLbl}</button></div>`;$("#mc").classList.add("open")}
function editForm(id){const it=id?M.find(i=>i.id===id):{name:"",cat:fCat==="All"?"":fCat,price:"",stock:"",promo:"",pFrom:"",pTo:""},cs=curCats();
 openM(`<h3>${id?"Edit product":"Add product"}</h3><div class="ef"><div><label for="fn">Product name *</label><input id="fn" maxlength="60" value="${esc(it.name)}"></div><div><label for="fc">Category *</label><select id="fc">${cs.length&&!it.cat?'<option value="">Choose a category</option>':""}${cs.map(c=>`<option${c===(it.cat||"")?" selected":""}>${esc(c)}</option>`).join("")}<option value="__new">+ New category...</option></select><input id="fcn" placeholder="New category name" maxlength="30" hidden style="margin-top:6px"></div><div><label for="fp">Price * (${esc(S.cur)})</label><input id="fp" type="number" inputmode="decimal" min="0" value="${esc(it.price)}"></div>${bundleBlock(it)}<div id="sw"${isB(it)?" hidden":""}><label for="fs">Stock</label><input id="fs" type="number" inputmode="numeric" min="0" value="${tracked(it)?it.stock:""}"><div class="hint">Leave empty if you do not count stock for this product.</div></div><div class="fgrid"><div><label for="fq">Promo price</label><input id="fq" type="number" inputmode="decimal" min="0" value="${nz(it.promo,"")}"></div><div class="hint" style="align-self:end">Leave empty for no promo. The normal price is shown crossed out.</div><div><label for="ff">Promo from</label><input id="ff" type="date" value="${it.pFrom||""}"></div><div><label for="ft">Promo until</label><input id="ft" type="date" value="${it.pTo||""}"></div></div></div><div id="fe" class="err" role="alert"></div><div class="two" style="margin-top:12px"><button data-a="close">Cancel</button><button class="primary" data-a="fsave" data-id="${id||""}">Review change</button></div>`);
 if(!cs.length){$("#fc").value="__new";$("#fcn").hidden=false}bSum()}
function review(id){id=id||null;const v=x=>$("#"+x).value.trim(),isb=$("#fb").checked,f={name:v("fn"),cat:v("fc")==="__new"?v("fcn"):v("fc"),price:v("fp"),stock:v("fs"),promo:v("fq"),pFrom:v("ff"),pTo:v("ft")},er=m=>{$("#fe").textContent=m},price=+f.price;
 if(!f.name)return er("Enter the product name.");
 if(!f.cat)return er("Choose a category or type a new one.");
 if(f.price===""||!isFinite(price)||price<=0)return er("Enter a price above 0.");
 if(!isb&&f.stock!==""&&!/^\d+$/.test(f.stock))return er("Stock must be a whole number (0 or more), or empty.");
 let bundle=null;
 if(isb){const q=bundleRead(),bad=Object.keys(q).filter(k=>q[k]!==""&&!/^[1-9]\d{0,1}$/.test(q[k]));bundle={};
  if(bad.length)return er("Quantities inside a bundle must be whole numbers from 1 to 99.");
  Object.keys(q).forEach(k=>{if(+q[k]>0)bundle[k]=+q[k]});
  if(!Object.keys(bundle).length)return er("Choose at least one product for the bundle and enter its quantity.");
  const inb=id?M.filter(b=>isB(b)&&b.bundle[id]):[];if(inb.length)return er("This product is used inside "+inb.map(b=>b.name).join(", ")+", so it cannot become a bundle itself.")}
 if(f.promo!==""){const pr=+f.promo;if(!isFinite(pr)||pr<0)return er("Promo price must be 0 or more.");if(pr>=price)return er("Promo price must be lower than the normal price.")}
 if((f.pFrom||f.pTo)&&f.promo==="")return er("Enter a promo price, or clear the promo dates.");
 if(f.pFrom&&f.pTo&&f.pFrom>f.pTo)return er("The promo start date must not be after the end date.");
 const dup=M.find(i=>i.id!==id&&on(i)&&String(i.name).trim().toLowerCase()===f.name.toLowerCase()&&(i.cat||"Other")===f.cat);
 if(dup)return er('A product named "'+dup.name+'" already exists in '+f.cat+".");
 const o=id?M.find(i=>i.id===id):null,nv={name:f.name,cat:f.cat,price,stock:isb||f.stock===""?"":+f.stock,promo:f.promo===""?"":+f.promo,pFrom:f.promo===""?"":f.pFrom,pTo:f.promo===""?"":f.pTo,bundle},
 bs=b=>b?Object.keys(b).sort().map(k=>b[k]+" x "+(M.find(m=>m.id===k)||{name:k}).name).join(", "):"",
 ov=o?Object.assign({},o,{bundle:bs(o.bundle)}):null,nd=Object.assign({},nv,{bundle:bs(bundle)}),
 lab=[["name","Name"],["cat","Category"],["price","Price"],["bundle","Bundle contains"],["stock","Stock"],["promo","Promo price"],["pFrom","Promo from"],["pTo","Promo until"]],
 sh=(k,x)=>x===""||x==null?"(none)":(k==="price"||k==="promo")?fmt(x):String(x),
 rows=lab.filter(a=>o?String(nz(ov[a[0]],""))!==String(nd[a[0]]):nd[a[0]]!=="").map(a=>o?`<div>${a[1]}: <s>${esc(sh(a[0],nz(ov[a[0]],"")))}</s> &rarr; <b>${esc(sh(a[0],nd[a[0]]))}</b></div>`:`<div>${a[1]}: <b>${esc(sh(a[0],nd[a[0]]))}</b></div>`);
 if(o&&!rows.length)return er("Nothing was changed.");
 cfm(o?"Confirm change":"Confirm new product",`<div class="diff"><b>${esc(nv.name)}</b>${rows.join("")}</div>${isb?'<div class="muted">Selling this bundle lowers the stock of the products inside it.</div>':""}<div class="muted">The change is kept only after you tap Save and close in Settings.</div>`,o?"Yes, apply change":"Yes, add product",()=>{
  let it=o;if(o)Object.assign(o,nv);else{it=Object.assign({id:"m"+Date.now(),active:true},nv);M.push(it)}
  if(!bundle)delete it.bundle;pendN++;closeM();renderList();pendSet()})}
const prodBox=i=>`<div class="diff"><b>${esc(i.name)}</b><div>${esc(i.cat||"Other")}, ${fmt(i.price)}</div></div>`;
const afterChange=()=>{pendN++;renderList();pendSet();if($("#mx").classList.contains("open"))offList()};
function hideAsk(id){const i=M.find(x=>x.id===id);cfm("Hide this product?",prodBox(i)+'<div class="muted">It disappears from the cashier screen. You can bring it back under Hidden products.</div>',"Yes, hide",()=>{i.active=false;afterChange()})}
function showAsk(id){const i=M.find(x=>x.id===id);cfm("Show this product again?",prodBox(i)+'<div class="muted">It returns to the cashier screen with its price and stock.</div>',"Yes, show it",()=>{i.active=true;afterChange()})}
function delAsk(id){const i=M.find(x=>x.id===id),used=M.filter(b=>isB(b)&&b.bundle[i.id]);if(used.length)return note("Cannot delete this product",prodBox(i)+'<div class="muted">It is used inside: '+esc(used.map(b=>b.name).join(", "))+". Remove it from the bundle first.</div>");cfm("Delete this product?",prodBox(i)+'<div class="muted" style="color:var(--bad)">It is removed from your menu for good once you save. Past sales stay in your reports. To stop selling it for a while, hide it instead.</div>',"Yes, delete",()=>{M.splice(M.indexOf(i),1);afterChange()})}
function offList(){const rows=M.filter(i=>!on(i)).map(i=>`<div class="pr"><div><b>${esc(i.name)}</b><div class="muted">${esc(i.cat||"Other")}, ${fmt(i.price)}</div></div><div></div><div class="pa"><button data-a="act" data-id="${i.id}">Show again</button><button class="danger" data-a="delx" data-id="${i.id}">Delete</button></div></div>`).join("");
 openM(`<h3>Hidden products</h3><div class="muted" style="margin-bottom:8px">These are not shown on the cashier screen.</div>${rows||'<div class="empty">No hidden products.</div>'}<button data-a="close" style="margin-top:12px">Close</button>`)}
function discard(){M=JSON.parse(snapM);save("cc_menu",M);pendN=0;$("#modal").classList.remove("open");renderMenu();renderCart()}
$("#eCancel").onclick=()=>{if(!pendN)return discard();cfm("Discard changes?","You have "+pendN+" unsaved product change"+(pendN>1?"s":"")+". They will be lost.","Yes, discard",discard)};
$(".tabs").onclick=e=>{const b=e.target.closest("button");if(b)showTab(b.dataset.t)};
$("#mCat").onchange=e=>{fCat=e.target.value;renderList()};$("#mSearch").oninput=e=>{fQ=e.target.value;renderList()};
$("#eAdd").onclick=()=>editForm(null);
$("#erows").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.e)editForm(b.dataset.e);else if(b.dataset.h)hideAsk(b.dataset.h);else if(b.dataset.d)delAsk(b.dataset.d)};
$("#mxc").addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(a==="fsave")review(b.dataset.id);else if(a==="act")showAsk(b.dataset.id);else if(a==="delx")delAsk(b.dataset.id)});
$("#mxc").addEventListener("change",e=>{if(e.target.id==="fc")$("#fcn").hidden=e.target.value!=="__new"});
$("#modal").addEventListener("input",()=>{$("#sErr").textContent=""});
$("#grid").onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("item")){e.preventDefault();e.target.click()}};
/* ---- bundles: a bundle is sold as one item but uses the stock of the products inside ---- */
const isB=i=>!!(i&&i.bundle&&typeof i.bundle==="object"&&Object.keys(i.bundle).length);
const comps=i=>Object.keys(i.bundle||{}).map(k=>({m:M.find(x=>x.id===k),n:+i.bundle[k]})).filter(c=>c.m&&c.n>0);
const expand=(i,q)=>isB(i)?comps(i).map(c=>[c.m,c.n*q]):[[i,q]];
const incStr=i=>isB(i)?comps(i).map(c=>c.n+" x "+c.m.name).join(", "):"";
const av=i=>{let a=null;expand(i,1).forEach(p=>{if(tracked(p[0])){const x=Math.floor(+p[0].stock/p[1]);a=a==null?x:Math.min(a,x)}});return a};
function usage(lines){const u={};lines.forEach(l=>{const it=M.find(i=>i.id===l.id);if(it)expand(it,l.qty).forEach(p=>{u[p[0].id]=(u[p[0].id]||0)+p[1]})});return u}
function canAdd(it){const u=usage(cart),e=expand(it,1);for(let k=0;k<e.length;k++){const m=e[k][0];if(tracked(m)&&(u[m.id]||0)+e[k][1]>+m.stock)return m}return null}
function note(t,b){$("#mcc").innerHTML=`<h3>${t}</h3>${b}<div style="margin-top:14px"><button class="primary" id="mcNo" style="width:100%">OK</button></div>`;$("#mc").classList.add("open")}
const bundleRows=it=>M.filter(m=>!isB(m)&&m.id!==it.id&&(on(m)||(it.bundle&&it.bundle[m.id]))).map(m=>`<div class="bi" data-c="${esc(m.cat||"Other")}" data-n="${esc(String(m.name).toLowerCase())}"><span>${esc(m.name)} <small class="muted">${esc(m.cat||"Other")}${tracked(m)?", stock "+m.stock:""}</small></span><input type="number" min="0" inputmode="numeric" data-bq="${m.id}" placeholder="0" value="${(it.bundle&&it.bundle[m.id])||""}" aria-label="Quantity of ${esc(m.name)} in one bundle"></div>`).join("");
const bundleBlock=it=>`<div><label class="chk"><input id="fb" type="checkbox"${isB(it)?" checked":""}> This product is a bundle (made of other products)</label></div><div id="bw"${isB(it)?"":" hidden"}><div class="hint" style="margin-bottom:6px">Enter how many of each product are inside ONE bundle. Selling a bundle lowers the stock of these products.</div><div class="toolbar"><input id="bq" type="search" placeholder="Search product" aria-label="Search product"><select id="bcat" aria-label="Filter by category"><option value="">All categories</option>${Array.from(new Set(M.filter(m=>on(m)&&!isB(m)).map(m=>m.cat||"Other"))).map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="bl" class="bl">${bundleRows(it)}</div><div class="hint" id="bsum"></div></div>`;
function bundleRead(){const q={};document.querySelectorAll("[data-bq]").forEach(x=>{if(x.value!=="")q[x.dataset.bq]=x.value.trim()});return q}
function bSum(){if(!$("#bsum"))return;const q=bundleRead();let t=0,c=0;Object.keys(q).forEach(k=>{const m=M.find(i=>i.id===k),n=+q[k];if(m&&n>0){t+=m.price*n;c+=n}});const p=+$("#fp").value;
 $("#bsum").textContent=c?"Contains "+c+" item"+(c>1?"s":"")+" worth "+fmt(t)+" at normal prices."+(p>0?(p<t?" The bundle price saves "+fmt(t-p)+".":p>t?" The bundle costs more than buying the items separately.":""):""):"No products chosen yet."}
function bFilter(){const q=$("#bq").value.trim().toLowerCase(),c=$("#bcat").value;document.querySelectorAll(".bi").forEach(r=>{r.hidden=!((!c||r.dataset.c===c)&&(!q||r.dataset.n.indexOf(q)>=0))})}
$("#mxc").addEventListener("change",e=>{if(e.target.id==="fb"){$("#bw").hidden=!e.target.checked;$("#sw").hidden=e.target.checked;bSum()}else if(e.target.id==="bcat")bFilter()});
$("#mxc").addEventListener("input",e=>{if(e.target.id==="bq")bFilter();else if(e.target.id==="fp"||e.target.dataset.bq)bSum()});
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},3500)}
function doPrint(){try{window.print()}catch(e){toast("Printing is not available in this browser.")}}
function saveRc(no){const r=load("cc_rc",[]);r.unshift({no,ts:Date.now(),html:$("#receipt").innerHTML});save("cc_rc",r.slice(0,30))}
function rcList(){const r=load("cc_rc",[]);
 openM(`<h3>Receipts</h3><div class="muted" style="margin-bottom:8px">The last ${r.length||30} receipts made on this device. Tap Print to print one again.</div>${r.map((x,i)=>`<div class="row" style="align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)"><span><b>${esc(x.no)}</b><div class="muted">${new Date(x.ts).toLocaleString()}</div></span><button data-a="rcprint" data-i="${i}">Print</button></div>`).join("")||'<div class="empty">No receipts yet.</div>'}<button data-a="close" style="margin-top:12px">Close</button>`)}
$("#mxc").addEventListener("click",e=>{const b=e.target.closest('[data-a="rcprint"]');if(!b)return;const r=load("cc_rc",[])[+b.dataset.i];if(r){$("#receipt").innerHTML=r.html;doPrint()}});
$("#btnRc").onclick=rcList;
$("#dq").onclick=e=>{const b=e.target.closest("button");if(b){$("#dType").value="%";$("#dVal").value=b.dataset.d;calc()}};
renderMenu();renderCart();hdr();syncNow(true);
var bt=document.getElementById("boot");if(bt)bt.parentNode.removeChild(bt);
</script>
